name: ci

on:
  push:
    branches: [main, "agent/**", "ci/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: "Cache dependencies"
        uses: actions/cache@v3
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: "Format check (rustfmt)"
        run: cargo fmt --all -- --check
      
      - name: "Compilation check"
        run: cargo check --workspace --all-targets
      
      - name: "Linting (clippy)"
        run: cargo clippy --workspace --all-targets -- -D warnings
      
      - name: "Run tests"
        run: cargo test --workspace --verbose
      
      - name: "Build documentation"
        run: cargo doc --workspace --no-deps --document-private-items
      
      - name: "Run demo application"
        run: cargo run --release --bin blackmamba-paint 2>&1 | head -50

