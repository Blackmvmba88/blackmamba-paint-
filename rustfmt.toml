# BlackMamba Paint - Rustfmt Configuration
# Enforce consistent code style across the workspace

# Edition and formatting version
edition = "2021"
format_code_in_doc_comments = true

# Line and indentation settings
max_width = 100
hard_tabs = false
tab_spaces = 4
indent_style = "Block"

# Comments and documentation
normalize_comments = true
comment_width = 80
wrap_comments = true

# Imports and item organization
reorder_imports = true
reorder_modules = true
group_imports = "StdExternalCrate"

# Function and control flow formatting
fn_single_line = false
where_single_line = false
match_block_trailing_comma = true
trailing_comma = "Vertical"

# Spaces and operators
space_before_colon = false
space_after_colon = true
spaces_around_ranges = false

# Blank line settings
blank_lines_lower_bound = 0
blank_lines_upper_bound = 1

# String and char literals
string_lit_attr_crate_path = "::core::prelude::v1"
force_explicit_abi = true

# Other style preferences
format_strings = true
normalize_doc_attributes = true
format_macro_bodies = true
format_macro_matchers = true
