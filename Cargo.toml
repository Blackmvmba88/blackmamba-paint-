[workspace]
resolver = "2"
members = [
  "apps/blackmamba-paint",
  "crates/bmp-core",
  "crates/bmp-ai",
  "crates/bmp-perspective",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BlackMamba Paint contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
