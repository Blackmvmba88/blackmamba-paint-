[workspace]
resolver = "2"
members = [
  "apps/blackmamba-paint",
  "apps/blackmamba-paint-desktop",
  "crates/bmp-core",
  "crates/bmp-ai",
  "crates/bmp-perspective",
  "crates/bmp-space",
  "crates/bmp-history",
  "crates/bmp-storage",
  "crates/bmp-input",
  "crates/bmp-path",
  "crates/bmp-trace",
  "crates/bmp-animation",
  "crates/bmp-projection",
  "crates/bmp-knowledge",
  "crates/bmp-brush",
  "crates/bmp-render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BlackMamba Paint contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
